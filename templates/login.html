{% extends "layout.html" %}

{% block title %}تسجيل الدخول - بوابة مرشد الدراسة{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #0078d4 0%, #50e3c2 100%);
    }
    .login-card {
        max-width: 450px;
        margin: 3rem auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <div class="content-wrapper login-card">
            
            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="fas fa-graduation-cap" style="font-size: 3rem; color: var(--primary-color);"></i>
                </div>
                <h2 style="font-weight: 600;">تسجيل الدخول</h2>
                <p class="text-muted" style="font-size: 0.9rem;">مرحباً بك في بوابة مرشد الدراسة</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> اسم المستخدم
                    </label>
                    <input type="text" class="form-control" id="username" name="username" 
                           required autofocus placeholder="أدخل اسم المستخدم">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> كلمة المرور
                    </label>
                    <input type="password" class="form-control" id="password" name="password" 
                           required placeholder="أدخل كلمة المرور">
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> دخول
                    </button>
                </div>
                
            </form>
            
            <hr class="my-4">
            
            <div class="text-center">
                <p class="mb-0">
                    ليس لديك حساب؟ 
                    <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">
                        إنشاء حساب جديد
                    </a>
                </p>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
