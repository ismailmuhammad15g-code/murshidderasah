{% extends "layout.html" %}

{% block title %}إنشاء حساب - بوابة مرشد الدراسة{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="content-wrapper">
            
            <div class="text-center mb-4">
                <h2><i class="fas fa-user-plus text-primary"></i> إنشاء حساب جديد</h2>
                <p class="text-muted">انضم إلى بوابة مرشد الدراسة</p>
            </div>
            
            <form method="POST" action="{{ url_for('register') }}">
                
                <div class="mb-3">
                    <label for="name" class="form-label">
                        <i class="fas fa-id-card"></i> الاسم الكامل
                    </label>
                    <input type="text" class="form-control" id="name" name="name" 
                           placeholder="أدخل اسمك الكامل">
                </div>
                
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> اسم المستخدم <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="username" name="username" 
                           required placeholder="اختر اسم مستخدم فريد">
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> البريد الإلكتروني
                    </label>
                    <input type="email" class="form-control" id="email" name="email" 
                           placeholder="example@email.com">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> كلمة المرور <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="password" name="password" 
                           required placeholder="أدخل كلمة مرور قوية" minlength="6">
                    <small class="form-text text-muted">يجب أن تحتوي على 6 أحرف على الأقل</small>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-user-plus"></i> إنشاء الحساب
                    </button>
                </div>
                
            </form>
            
            <hr class="my-4">
            
            <div class="text-center">
                <p class="mb-0">
                    لديك حساب بالفعل؟ 
                    <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">
                        تسجيل الدخول
                    </a>
                </p>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
