{% extends "layout.html" %}

{% block title %}500 - خطأ في الخادم{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <div class="content-wrapper">
            
            <div class="mb-4">
                <i class="fas fa-tools fa-5x text-danger"></i>
            </div>
            
            <h1 class="display-1 text-danger">500</h1>
            <h2 class="mb-4">خطأ في الخادم</h2>
            
            <p class="lead text-muted mb-4">
                عذراً، حدث خطأ غير متوقع. نحن نعمل على حل المشكلة.
            </p>
            
            <div class="alert alert-info" role="alert">
                <i class="fas fa-info-circle"></i>
                إذا استمرت المشكلة، يرجى المحاولة لاحقاً أو التواصل مع الدعم الفني.
            </div>
            
            <div class="d-grid gap-2 d-md-block">
                <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg">
                    <i class="fas fa-home"></i> العودة للرئيسية
                </a>
                <button onclick="location.reload()" class="btn btn-secondary btn-lg">
                    <i class="fas fa-redo"></i> إعادة المحاولة
                </button>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
